# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Ticketer
version: "0.4.0"
slug: ticketer
description: Phone-captured parking reports, reviewed before submission (review build)
url: "https://github.com/jbuberel/ticketer-ha"
arch:
  - aarch64
  - amd64
image: "ghcr.io/jbuberel/ticketer"
stage: experimental
# Supervisor matches each pattern against the right-hand end of every file path under /data,
# so this skips photos/<batch>/<file> and keeps ticketer.db.
backup_exclude:
  - "photos/*/*"
# No ports, no host network, no HA API: the app is reachable only over Tailscale.
options:
  tailscale_hostname: ticketer
  tailscale_tags: "tag:ticketer"
  extractor_model: claude-sonnet-5
schema:
  tailscale_auth_key: "password?"
  tailscale_hostname: "str"
  tailscale_tags: "str?"
  anthropic_api_key: "password?"
  extractor_model: "str"
