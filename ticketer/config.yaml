# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Ticketer
version: "0.6.3"
slug: ticketer
description: Phone-captured parking reports, reviewed by you, then filed with Sacramento 311
url: "https://github.com/jbuberel/ticketer-ha"
arch:
  - aarch64
  - amd64
image: "ghcr.io/jbuberel/ticketer"
stage: experimental
# Supervisor matches each pattern against the right-hand end of every file path under /data,
# so this skips photos/<batch>/<file> and keeps ticketer.db.
backup_exclude:
  - "photos/*/*"
# No ports, no host network, no HA API: the app is reachable only over Tailscale.
options:
  tailscale_hostname: ticketer
  tailscale_tags: "tag:ticketer"
  extractor_model: claude-sonnet-5
  # Leave this on until you have checked a dry run. With it on, Submit builds the exact request
  # and shows it to you without filing anything with the city.
  submit_dry_run: true
  # Send the photo with each request. A photo makes a response more likely, and becomes part
  # of the public case record along with the rest of the request.
  attach_photo: true
schema:
  tailscale_auth_key: "password?"
  tailscale_hostname: "str"
  tailscale_tags: "str?"
  anthropic_api_key: "password?"
  extractor_model: "str"
  submit_dry_run: "bool"
  attach_photo: "bool"
  # Who the request is filed as. Leave all four empty to file anonymously; 311 then sends no
  # confirmation email.
  reporter_first_name: "str?"
  reporter_last_name: "str?"
  reporter_email: "email?"
  reporter_phone: "str?"
