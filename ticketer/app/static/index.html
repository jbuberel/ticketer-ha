<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ticketer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1f5f99">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5b6270; --border: #dde1e7;
      --accent: #1f5f99; --accent-text: #ffffff; --subtle: #e8ebf0;
      --ok: #1e7a3c; --ok-bg: #e3f4e8; --warn: #8a5a00; --warn-bg: #fdf1d8;
      --bad: #b3261e; --bad-bg: #fbe4e2; --info-bg: #e5eef8;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1b1e24; --text: #e8eaee; --muted: #9aa2af; --border: #2c3038;
        --accent: #6aa9e0; --accent-text: #0b1520; --subtle: #262a31;
        --ok: #8fd6a4; --ok-bg: #173323; --warn: #f0c56b; --warn-bg: #3a2d10;
        --bad: #f2b8b5; --bad-bg: #3d1a18; --info-bg: #1b2a3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 34rem; margin: 0 auto; display: grid; gap: 14px; }
    h1 { font-size: 1.4rem; margin: 4px 0 0; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    header p { margin: 2px 0 0; }
    .muted { color: var(--muted); }
    .small { font-size: 0.85rem; }
    .warn-text { color: var(--warn); font-size: 0.85rem; }
    .error-text { color: var(--bad); }
    a { color: var(--accent); }
    .button {
      display: block; width: 100%; text-align: center; font: inherit; font-weight: 600;
      padding: 13px; border: 0; border-radius: 12px; cursor: pointer; text-decoration: none;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .button.primary { background: var(--accent); color: var(--accent-text); }
    .button.subtle { background: var(--subtle); color: var(--text); }
    .button.big { padding: 22px; font-size: 1.15rem; }
    .button:disabled, .button.disabled { opacity: 0.5; pointer-events: none; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .notice { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--info-bg); }
    .notice.error { background: var(--bad-bg); color: var(--bad); }
    .gps { padding: 8px 12px; border-radius: 10px; background: var(--subtle); font-variant-numeric: tabular-nums; }
    .gps.ok { background: var(--ok-bg); color: var(--ok); }
    .gps.warn { background: var(--warn-bg); color: var(--warn); }
    .gps.bad { background: var(--bad-bg); color: var(--bad); }
    .chip { display: inline-block; font-size: 0.75rem; padding: 1px 8px; border-radius: 99px; background: var(--subtle); color: var(--muted); }
    .chip.uploaded, .chip.queued-server { background: var(--ok-bg); color: var(--ok); }
    .chip.failed { background: var(--bad-bg); color: var(--bad); }
    .chip.uploading, .chip.locating { background: var(--warn-bg); color: var(--warn); }
    .chip.capturing { background: var(--warn-bg); color: var(--warn); }
    .chip.queued { background: var(--info-bg); color: var(--accent); }
    .shots, .photos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .shot {
      display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px;
    }
    .shot img, .shot .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--subtle); }
    .icon {
      width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent;
      color: var(--muted); font-size: 1.1rem; cursor: pointer;
    }
    .icon:disabled { opacity: 0.3; }
    .actions { display: grid; gap: 8px; margin-top: 8px; }
    .actions p { margin: 0; text-align: center; }
    .batches { display: grid; gap: 8px; }
    .batch {
      display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: inherit; text-decoration: none;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    }
    .photos > li { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .photos img { display: block; width: 100%; height: auto; background: var(--subtle); }
    .chip.ok, .chip.ready { background: var(--ok-bg); color: var(--ok); }
    .chip.warn, .chip.processing { background: var(--warn-bg); color: var(--warn); }
    .chip.bad { background: var(--bad-bg); color: var(--bad); }
    .draft-body { padding: 10px 12px 12px; display: grid; gap: 6px; }
    .plate-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .plate { font: 700 1.5rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; }
    .photos img.plate-crop { width: 240px; max-width: 100%; border-radius: 6px; }
    .button.inline { display: inline-block; width: auto; padding: 6px 12px; margin-left: 8px; }
    .back { text-decoration: none; font-weight: 600; }
    .button.danger { background: transparent; color: var(--bad); border: 1px solid var(--border); }
    h3 { margin: 0; font-size: 1rem; }
    .notice.warn { background: var(--warn-bg); color: var(--warn); }
    .notice.ok { background: var(--ok-bg); color: var(--ok); }
    .notice .small { margin-top: 2px; }
    .chip.edited { background: var(--info-bg); color: var(--accent); }
    .photos > li.report { border: 2px solid var(--accent); }
    .photos > li.skip > img { opacity: 0.45; }
    .flags { margin: 0; padding: 8px 12px 8px 28px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 0.85rem; }
    .plate.unverified { text-decoration: underline wavy var(--warn); text-underline-offset: 6px; }
    .review { display: flex; gap: 8px; margin-top: 4px; }
    .review .button { width: auto; padding: 10px 16px; }
    .segmented { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: var(--subtle); }
    .seg {
      font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 8px 6px; cursor: pointer;
      background: transparent; color: var(--text); -webkit-tap-highlight-color: transparent;
    }
    .seg:disabled { opacity: 0.5; }
    .seg.on.report { background: var(--accent); color: var(--accent-text); }
    .seg.on.skip { background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); }
    .field { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
    .field input {
      width: 100%; font: inherit; font-size: 1rem; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .field input.plate-input { font: 700 1.3rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .readings { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
    .reading {
      font: 600 0.9rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 5px 10px; cursor: pointer;
      border: 1px solid var(--border); border-radius: 99px; background: var(--card); color: var(--text);
    }
    .check { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
    .check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
    .form-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 4px; }
    #toast {
      position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 34rem; margin: 0 auto; padding: 12px 14px; border-radius: 12px;
      background: var(--bad-bg); color: var(--bad); border: 1px solid var(--border); box-shadow: 0 4px 16px rgb(0 0 0 / 0.2);
    }
  </style>
</head>
<body>
  <main id="view"></main>
  <div id="toast" role="alert" hidden></div>
  <noscript>Ticketer needs JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
